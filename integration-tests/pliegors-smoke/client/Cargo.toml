[package]
name = "pliegocss-pliegors-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["Document", "Element", "Window"] }
