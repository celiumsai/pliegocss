[package]
name = "pliegocss-pliegors-smoke"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "pliegocss-pliegors-ssg"

# This fixture is intentionally detached: it depends on the sibling PliegoRS
# checkout and is run only by the cross-repository integration gate.
[workspace]
members = ["client"]
resolver = "2"

[[bin]]
name = "pliegocss-pliegors-smoke"
path = "src/main.rs"

[[bin]]
name = "pliegocss-pliegors-ssg"
path = "src/bin/ssg.rs"

[[bin]]
name = "pliegocss-pliegors-collector"
path = "src/bin/collector.rs"

[dependencies]
pliego-css = { path = "../../crates/pliego-css" }
pliego-css-source = { path = "../../crates/pliego-css-source" }
pliego-dom = { path = "../../../pliegors/crates/pliego-dom" }
pliego-macros = { path = "../../../pliegors/crates/pliego-macros" }
pliego-resume = { path = "../../../pliegors/crates/pliego-resume" }
pliego-ssg = { path = "../../../pliegors/crates/pliego-ssg" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
