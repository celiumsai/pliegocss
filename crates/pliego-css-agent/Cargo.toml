[package]
name = "pliego-css-agent"
description = "Deterministic bounded repair plans, application, and verification for PliegoCSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
exclude = ["tests"]
keywords.workspace = true
categories.workspace = true

[features]
default = []
package-verify = []

[dependencies]
fs2 = "0.4.3"
pliego-css-build = { workspace = true, features = ["artifacts"] }
pliego-css-config.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true
