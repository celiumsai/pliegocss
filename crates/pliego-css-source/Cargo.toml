[package]
name = "pliego-css-source"
description = "Static Rust source scanner for PliegoCSS macro literals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pliego-css-source"
publish.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
pliego-css-io.workspace = true
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
syn = { version = "2.0.117", features = ["full", "parsing", "visit"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[lints]
workspace = true
