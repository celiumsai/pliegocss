[package]
name = "pliego-css-config"
description = "Validated build-time theme configuration for PliegoCSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
exclude = ["tests"]
keywords.workspace = true
categories.workspace = true

[features]
default = []
compatibility-data = ["dep:lightningcss"]
css-analysis = ["dep:lightningcss"]

[dependencies]
lightningcss = { version = "1.0.0-alpha.71", default-features = false, optional = true }
pliego-css-ir.workspace = true
pliego-css-theme.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
toml = "1.1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[lints]
workspace = true
