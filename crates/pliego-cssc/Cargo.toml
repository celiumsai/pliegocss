[package]
name = "pliego-cssc"
description = "Command-line CSS compiler for PliegoCSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
exclude = ["tests"]
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "pliego-cssc"
path = "src/main.rs"
test = false

[features]
package-verify = []

[dependencies]
fs2 = "0.4.3"
pliego-css-agent.workspace = true
pliego-css-build = { workspace = true, features = ["artifacts", "catalog"] }
pliego-css-cascade.workspace = true
pliego-css-compiler.workspace = true
pliego-css-config.workspace = true
pliego-css-control = { workspace = true, features = ["projection"] }
pliego-css-ir.workspace = true
pliego-css-ownership.workspace = true
pliego-css-parser.workspace = true
pliego-css-source.workspace = true
pliego-css-theme.workspace = true
pliego-css-usage.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[lints]
workspace = true
