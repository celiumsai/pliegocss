[package]
name = "pliego-css-cascade"
description = "Fail-closed standard-CSS cascade explanation for PliegoCSS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/pliego-css-cascade"
publish.workspace = true
readme = "README.md"
exclude = ["tests"]
keywords.workspace = true
categories.workspace = true

[features]
default = []
package-verify = []

[dependencies]
lightningcss = { version = "=1.0.0-alpha.71", default-features = false }
cssparser = "=0.33.0"
parcel_selectors = "=0.28.2"
serde = { version = "1.0.228", features = ["derive"] }

[lints]
workspace = true
