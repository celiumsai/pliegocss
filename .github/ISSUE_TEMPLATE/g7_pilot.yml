name: G7 pilot interest
description: Signal interest in the external adoption cohort without posting private material.
title: "[G7 pilot]: "
labels:
  - g7-pilot
body:
  - type: markdown
    attributes:
      value: |
        This public form is a recruitment signal only. It is not consent and does not count as
        evidence. Do not post names, email addresses, credentials, private repository URLs,
        proprietary source, transcripts, or incident material.

        Read the [cohort notice](https://github.com/celiumsai/pliegocss/issues/7) and
        [privacy notice](https://pliegocss.dev/legal/privacy/). Private intake uses
        hello@pliegocss.dev after eligibility review.
  - type: dropdown
    id: adapter
    attributes:
      label: Candidate adapter
      options:
        - Static HTML
        - Vite 8.1.5
        - Pinned PliegoRS rendered output
        - Outside the certified pilot matrix
    validations:
      required: true
  - type: dropdown
    id: tailwind
    attributes:
      label: Tailwind baseline
      options:
        - Tailwind CSS 3.4.19
        - Tailwind CSS 4.3.3
        - Another version
        - Not currently using Tailwind
    validations:
      required: true
  - type: dropdown
    id: visibility
    attributes:
      label: Project visibility
      options:
        - Public project
        - Private project — details will be shared only through private intake
    validations:
      required: true
  - type: input
    id: public_project
    attributes:
      label: Public project URL
      description: Optional. Leave blank for a private project; never paste a private URL.
      placeholder: https://github.com/example/project
  - type: textarea
    id: goal
    attributes:
      label: Pilot goal
      description: Describe the adoption question without source code or identifying private details.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Eligibility and privacy boundary
      options:
        - label: I maintain or control the candidate project.
          required: true
        - label: The project is not owned by Celiums Solutions, PliegoCSS, or celiumsai.
          required: true
        - label: This issue contains no personal data, credentials, proprietary source, or private evidence.
          required: true
        - label: I understand this public issue is not research consent and does not count as G7 evidence.
          required: true
